worker_processes auto

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  keepalive_timeout 65;
  client_max_body_size 20m;

  # Docker's internal DNS — defer upstream resolution to request time
  resolver 127.0.0.11 valid=10s ipv6=off;

  # Redirect HTTP to HTTPS
  server {
    listen 80;
    server_name walkthrough.io.vn;
    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl;
    server_name walkthrough.io.vn;

    ssl_certificate /etc/nginx/certs/live/walkthrough.io.vn/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/live/walkthrough.io.vn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # SSL Hardening
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Spring Boot API
    location /api/ {
      set $server_upstream http://server:8096;
      rewrite ^/api/(.*) /$1 break;
      proxy_pass $server_upstream;

      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Next.js app
    location / {
      set $client_upstream http://client:3000;
      proxy_pass $client_upstream;

      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
