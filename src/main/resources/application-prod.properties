spring.application.name=walkthrough-server

server.port=${SERVER_PORT:8096}

# Datasource
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Flyway
spring.flyway.locations=classpath:db/migration
spring.flyway.enabled=true
spring.flyway.default-schema=walkthrough

# JPA
spring.jpa.properties.hibernate.default_schema=walkthrough
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

# Mail
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# CORS
cors.allowed.origins=${CORS_ALLOWED_ORIGINS}

# JWT
jwt.secret.key=${JWT_SECRET_KEY}
jwt.expiry.access-token=${JWT_ACCESS_TOKEN_EXPIRY:300}
jwt.expiry.refresh-token=${JWT_REFRESH_TOKEN_EXPIRY:2592000}
jwt.issuer=walkthrough-server

# Client URL
client.web.url=${CLIENT_WEB_URL}

# GitHub OAuth
github.oauth.client-id=${GITHUB_CLIENT_ID}
github.oauth.client-secret=${GITHUB_CLIENT_SECRET}

# Cookie must be secure over HTTPS
app.cookie.secure=true

# RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST:rabbitmq}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}

# Elasticsearch
app.elasticsearch.uris=${ELASTICSEARCH_URIS:http://elasticsearch:9200}
app.elasticsearch.connect-timeout=2s
app.elasticsearch.read-timeout=5s
app.elasticsearch.index.alias=walkthroughs
app.elasticsearch.index.version=v1

# Redis
spring.data.redis.host=${REDIS_HOST:redis}
spring.data.redis.port=${REDIS_PORT:6379}

# AI
app.ai.provider=${AI_PROVIDER:deepseek}
app.ai.enabled=${AI_ENABLED:true}
app.ai.deepseek.base-url=${DEEPSEEK_BASE_URL:https://api.deepseek.com}
app.ai.deepseek.api-key=${DEEPSEEK_API_KEY}
app.ai.deepseek.model=${DEEPSEEK_MODEL:deepseek-chat}
app.ai.deepseek.connect-timeout=5s
app.ai.deepseek.read-timeout=60s
app.ai.deepseek.max-tokens=2048
app.ai.deepseek.temperature=0.1
app.ai.scan.max-files=30
app.ai.scan.window-context-lines=3
app.ai.scan.max-window-chars=6000
